name: Build Ultra Pro Studio Android

on:
  workflow_dispatch:
    inputs:
      artifact_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - debug-apk
          - release-aab
        default: debug-apk
  push:
    branches: [main]
    paths:
      - "indexx.html"
      - "capacitor.config.ts"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      APP_SERVER_URL: ${{ vars.APP_SERVER_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate production URL
        shell: bash
        run: |
          if [[ -z "$APP_SERVER_URL" ]]; then
            echo "::error::Set repository Actions variable APP_SERVER_URL to the HTTPS URL of your live Hugging Face Space."
            exit 1
          fi
          if [[ "$APP_SERVER_URL" != https://* ]]; then
            echo "::error::APP_SERVER_URL must start with https://"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Install native Back handling
        run: node scripts/prepare-android.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        if: ${{ github.event_name == 'push' || inputs.artifact_type == 'debug-apk' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release AAB (unsigned)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_type == 'release-aab' }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload debug APK
        if: ${{ github.event_name == 'push' || inputs.artifact_type == 'debug-apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: ultra-pro-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release AAB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_type == 'release-aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: ultra-pro-studio-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
